<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopPulse — All-in-one GST-compliant billing, inventory, and CRM management for Indian businesses.">
  <title>ShopPulse — GST Business Management</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">

  <style>
    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: hsl(222, 47%, 10%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 60px;
      height: 60px;
      background: hsl(221, 83%, 53%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loading-logo .material-icons {
      font-size: 32px;
      color: white;
    }

    .loading-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .loading-subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
    }

    .loading-bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      background: hsl(221, 83%, 53%);
      border-radius: 3px;
      animation: loading 1.2s ease-in-out forwards;
    }

    @keyframes loading {
      0% { width: 0; }
      100% { width: 100%; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">
      <span class="material-icons">electric_bolt</span>
    </div>
    <div class="loading-title">ShopPulse</div>
    <div class="loading-subtitle">GST-Compliant Business Management</div>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- App Layout -->
  <div id="app" class="app-layout">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <!-- Rendered by app.js -->
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">

      <!-- Topbar -->
      <header id="topbar" class="topbar">
        <!-- Rendered by app.js -->
      </header>

      <!-- Page Content -->
      <main id="page-content" class="page-content">
        <!-- Rendered dynamically by router -->
      </main>

    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="hidden"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- App Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/crm.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/ai.js"></script>

  <script>
    // Dismiss loading screen after app initializes
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading-screen');
        if (loading) {
          loading.classList.add('fade-out');
          setTimeout(() => loading.remove(), 450);
        }
      }, 1300);
    });

    // Close sidebar on outside click (mobile)
    document.addEventListener('click', (e) => {
      const sidebar = document.getElementById('sidebar');
      const toggle = document.querySelector('.sidebar-toggle');
      if (sidebar && sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== toggle && !toggle?.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });
  </script>

</body>
</html>
