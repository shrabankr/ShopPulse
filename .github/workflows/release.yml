name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Desktop App
        run: npm run pack

      - name: Copy loose EXE for direct download
        shell: pwsh
        run: |
          Copy-Item "dist/ShopPulse-win32-x64/ShopPulse.exe" -Destination "dist/ShopPulse.exe" -Force

      - name: Create Portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "dist/ShopPulse-windows-x64.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ShopPulse.exe
            dist/ShopPulse-windows-x64.zip
          name: ShopPulse Release ${{ github.ref_name }} (Beta)
          body: |
            ## ⚡ ShopPulse Desktop ${{ github.ref_name }} (Beta)
            
            All-in-One GST-Compliant Billing, Inventory, and CRM for Indian IT & CCTV Businesses.
            
            ### ✨ What's New in ${{ github.ref_name }}:
            - 🛠️ **Developer License Switcher & Cloud Override**: Change plans, customize keys, and remote control client accounts.
            - 🚚 **Separate Billing & Shipping Address**: 1-click radio toggle with full consignee delivery details printed on GST tax invoices.
            - 🎨 **Live Bill Format Preview**: Interactive live preview modal with 5 distinct invoice formats (*Classic*, *Modern Minimalist*, *3-Inch POS Receipt*, *Executive Slate & Gold*, *Custom Template*).
            - 🔒 **Owner Security PIN Management**: 3-step secure PIN update (*Current PIN*, *New PIN*, *Confirm PIN*) with master developer recovery.
            - 📲 **WhatsApp Integration**: WhatsApp business numbers, 1-click customer WhatsApp chat, and WhatsApp bill sharing.
            - 🖨️ **Seamless Desktop Printing**: Native Windows Print & Save as PDF without browser popup errors.
            
            ### 📥 Download Options:
            - **`ShopPulse-windows-x64.zip`** (Recommended) — Full package with all runtime libraries. Extract and double-click `ShopPulse.exe`.
            - **`ShopPulse.exe`** — Direct executable.
            
            ### 🚀 How to Run:
            1. Download and extract `ShopPulse-windows-x64.zip`.
            2. Double-click `ShopPulse.exe` to launch immediately (Offline-first, no setup needed).
          draft: false
          prerelease: false
