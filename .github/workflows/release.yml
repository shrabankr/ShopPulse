name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package Portable App
        run: npm run pack

      - name: Create Portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "dist/ShopPulse-v1.0.0-windows-portable.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
          name: ShopPulse v${{ github.ref_name }} — Official Desktop Release
          body: |
            ## ⚡ ShopPulse Desktop ${{ github.ref_name }}
            
            GST-compliant billing, inventory, and CRM for Indian IT & CCTV businesses.
            
            ### 📥 Download Options:
            - **`ShopPulse Setup 1.0.0.exe`** (Recommended) — 1-Click Windows installer with desktop shortcut.
            - **`ShopPulse-v1.0.0-windows-portable.zip`** — Standalone portable folder (no installation required).
            
            ### 🚀 How to Run:
            1. **Installer**: Download `ShopPulse Setup 1.0.0.exe` and double-click to install.
            2. **Portable**: Extract `ShopPulse-v1.0.0-windows-portable.zip` and run `ShopPulse.exe`.
          draft: false
          prerelease: false
