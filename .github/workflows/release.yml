name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Standalone Installer
        run: npx electron-builder --win --x64 --publish never

      - name: Package Desktop Directory Archive
        run: npm run pack

      - name: Create Portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "dist/ShopPulse-windows-x64.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*Setup*.exe
            dist/ShopPulse-windows-x64.zip
          name: ShopPulse ${{ github.ref_name }} — Unified Enterprise Edition
          body: |
            ## ⚡ ShopPulse Desktop ${{ github.ref_name }} — Unified Enterprise Edition

            Specialized GST-Compliant Billing, Inventory, RMA, Dispatch Challans, Aging Khata, and CRM for Indian IT, CCTV & Electronics Retailers.

            ### ✨ What's Included in Unified ${{ github.ref_name }}:
            - 🚚 **GST Delivery Challan & Dispatch Gate Pass (GST Rule 55)**:
              - 1-Click creation from Sales Invoices or Service Job Sheets.
              - Dual layouts: A4 Official Delivery Challan (with transport metadata, vehicle/LR/e-way numbers, hardware serial numbers, and physical receiver signature & rubber stamp block) and 3" Thermal POS Gate Pass roll slip.
              - Dedicated `#challans` transaction hub with 1-click WhatsApp dispatch notice.
            - ⚡ **Rapid USB Barcode Scanner POS Mode**:
              - Continuous zero-touch scanning with any standard USB/wireless barcode gun.
              - Auto-increments cart item quantity with instant green highlight and Web Audio API synthesizer chime.
              - Fast `F2` keyboard shortcut to focus scanner input or launch a new sales invoice.
            - 📊 **Aging Khata & Credit Overdue Analysis Dashboard**:
              - Automated credit categorization into 4 aging buckets: 0–30d (Current), 31–60d (Overdue), 61–90d (Critical), and 90+d (High Risk / Bad Debt).
              - Interactive KPI filter cards in `#receivables` and `#payables`.
              - Tiered 1-click WhatsApp payment reminders with Shop UPI ID (*Gentle*, *Urgent*, *Final*).
              - 1-Click Aging CSV export for accounting reviews.
            - 💬 **Enhanced 1-Click Zero-Cost WhatsApp Dispatch Engine**:
              - Interactive preview modal with phone number normalizer (`+91`), bold text preview, direct web/desktop launch, clipboard copy, and PDF export shortcut.
              - Multi-scenario presets for Sales Invoices, Payment Receipts, Service Tickets (Intake, Estimate, Ready, Status), AMC Contracts, and Customer Ledgers.
            - 💳 **Split Payments & Multi-Tender Support**:
              - Pay via multiple modes simultaneously (Cash, UPI, Card, Cheque, Credit) with live change return calculator.
            - 🛡️ **Hardware Serial Number (S/N) & Warranty Tracking**:
              - Complete serial number capture and 1-click Warranty Lookup Hub.
            - 🏛️ **Official GSTR-1 JSON Generator**:
              - Direct portal upload `.json` return files for B2B, B2CS, CDNR, Table 12 HSN, and Table 13 Documents.
            - 💼 **Daily Cash Register & Shift Balancing (Z-Report)**:
              - Complete POS till management with currency denomination note counter and variance audit.

            ### 📥 Download Options:
            - **`ShopPulse-Setup-2.0.0.exe`**: Windows Installer Wizard (installs Desktop icon & Start Menu shortcut).
            - **`ShopPulse-windows-x64.zip`**: Portable ZIP archive — extract anywhere and double-click `ShopPulse.exe` (no installation needed).

            ### 🚀 How to Run:
            1. Download and run **`ShopPulse-Setup-2.0.0.exe`** for standard installation, OR extract **`ShopPulse-windows-x64.zip`** for portable use.
            2. Double-click `ShopPulse.exe` to launch immediately (100% offline-ready, browser `localStorage` powered).
          draft: false
          prerelease: false
