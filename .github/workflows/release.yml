name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Standalone Installer
        run: npx electron-builder --win --x64 --publish never

      - name: Package Desktop Directory Archive
        run: npm run pack

      - name: Create Portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "dist/ShopPulse-windows-x64.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*Setup*.exe
            dist/ShopPulse-windows-x64.zip
          name: ShopPulse ${{ github.ref_name }} — Specialized Computer & Electronics Store Edition
          body: |
            ## ⚡ ShopPulse Desktop ${{ github.ref_name }}

            Specialized GST-Compliant Billing, Inventory, RMA, and CRM for Indian Computer, CCTV & Electronics Retailers.

            ### ✨ What's New in ${{ github.ref_name }}:
            - 🛡️ **Hardware Serial Number (S/N) & IMEI Tracking**: Record line-item serial numbers across Sales Invoices, Purchase Bills, and print them on all receipts.
            - ⏳ **Warranty Engine & Expiry Tracking**: Supports Testing Warranty, 3M, 6M, 1–5 Years, and Lifetime coverage with live active/expired badges.
            - 🔍 **Hardware Serial & Warranty Lookup Hub**: 1-click topbar search (`Warranty S/N`) to instantly look up any S/N, view customer invoice, remaining warranty, and distributor RMA records.
            - 🏷️ **Dual Pricing Engine (Retail vs Dealer / Wholesale)**: Auto-detects dealer accounts and offers a 1-click rate toggle pill on line items.
            - 🔫 **Barcode Scanner Gun Fast-Add Bar**: Scan barcodes directly into invoices with zero-dependency offline audio feedback.
            - 📜 **Quotation & Estimations**: Issue quotations with 1-click item-by-item conversion to GST Tax Invoices.
            - 🔄 **Sales & Purchase Return Engine**: Issue Credit Notes and Debit Notes with automated real-time stock restoration.
            - 🧾 **Multi-Format Invoicing**: Classic GST, Modern Blue, 3" POS Thermal Slip (80mm), and Executive Dark templates.
            - ✈️ **100% Offline Capable**: Bundled offline Inter fonts and Material Icons — zero external network or CDN dependency.
            
            ### 📥 Download Options:
            - **`ShopPulse-Setup-${{ github.ref_name }}.exe`**: Windows Installer Wizard (installs Desktop icon & Start Menu shortcut).
            - **`ShopPulse-windows-x64.zip`**: Portable ZIP archive — extract anywhere and double-click `ShopPulse.exe` (no installation needed).
            
            ### 🚀 How to Run:
            1. Download and run **`ShopPulse-Setup-${{ github.ref_name }}.exe`** for standard installation, OR extract **`ShopPulse-windows-x64.zip`** for portable use.
            2. Double-click `ShopPulse.exe` to launch immediately (100% offline-ready).
          draft: false
          prerelease: false
