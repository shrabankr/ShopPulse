name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Desktop App
        run: npm run pack

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "ShopPulse-windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ShopPulse-windows-x64.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## ShopPulse Desktop ${{ github.ref_name }}
            
            GST-compliant billing, inventory, and CRM for IT/CCTV businesses.
            
            ### Installation Instructions (Windows)
            1. Download `ShopPulse-windows-x64.zip` below.
            2. Extract the ZIP archive to any folder.
            3. Run `ShopPulse.exe` to launch the application.
          draft: false
          prerelease: false
