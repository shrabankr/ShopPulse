name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Desktop App
        run: npm run pack

      - name: Copy loose EXE for direct download
        shell: pwsh
        run: |
          Copy-Item "dist/ShopPulse-win32-x64/ShopPulse.exe" -Destination "dist/ShopPulse.exe" -Force

      - name: Create Portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ShopPulse-win32-x64/*" -DestinationPath "dist/ShopPulse-windows-x64.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ShopPulse.exe
            dist/ShopPulse-windows-x64.zip
          name: ShopPulse v${{ github.ref_name }} — Official Desktop Release
          body: |
            ## ⚡ ShopPulse Desktop ${{ github.ref_name }}
            
            All-in-One GST-Compliant Billing, Inventory, and CRM for Indian IT & CCTV Businesses.
            
            ### 📥 Download Options:
            - **`ShopPulse.exe`** — Direct executable download.
            - **`ShopPulse-windows-x64.zip`** (Recommended) — Full package with all runtime libraries.
            
            ### 🚀 How to Run:
            1. Extract `ShopPulse-windows-x64.zip` to any folder on your computer.
            2. Double-click `ShopPulse.exe` to launch.
          draft: false
          prerelease: false
